[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrt-rag"
version = "0.1.0"
description = "RAG sul Regolamento di esecuzione (UE) 2023/894: modelli QRT Solvency II"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "rank-bm25",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
parsing = ["docling", "pypdf"]
llm = ["transformers", "accelerate"]
ui = ["gradio"]
eval = ["pandas"]
all = ["docling", "pypdf", "transformers", "accelerate", "gradio", "pandas"]

[tool.setuptools]
packages = ["qrt_rag"]

[tool.setuptools.package-data]
qrt_rag = ["eval_set.json"]
